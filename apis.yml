apis:
  - aid: university-of-melbourne:spatial-open-data
    name: Open Spatial Data Portal (ArcGIS Hub)
    description: >-
      University of Melbourne open spatial-data portal hosted on ArcGIS Hub for
      exploring and downloading campus GIS layers including building, road and
      tree-canopy footprints. Datasets are served through the standard ArcGIS
      Hub / ArcGIS REST query and download APIs (GeoJSON, CSV, Shapefile, KML).
      Portal verified live (HTTP 200).
    humanURL: https://spatialdata-uom.opendata.arcgis.com/
    tags: [Open Data, GIS, Geospatial, ArcGIS, Spatial]
    properties:
      - type: Documentation
        url: https://spatialdata-uom.opendata.arcgis.com/
  - aid: university-of-melbourne:boomi-developer-portal
    name: Internal API Management Developer Portal (Boomi) — Gated
    description: >-
      The University of Melbourne operates a Boomi-based API management
      developer portal providing self-service access to internal data APIs for
      staff and students. This portal is gated behind university authentication
      and is not publicly documented; no public endpoints, base URL or sign-up
      could be confirmed. Listed here honestly as a known but non-public API
      surface.
    humanURL: https://boomi.com/blog/university-of-melbourne-innovates-with-api-driven-strategy/
    tags: [API Management, Boomi, Internal, Gated]
    properties:
      - type: Documentation
        url: https://boomi.com/blog/university-of-melbourne-innovates-with-api-driven-strategy/
