aid: university-of-melbourne
name: University of Melbourne
x-type: university
x-category: Public Research University
description: >-
  The University of Melbourne is Australia's leading research university, a
  Group of Eight member founded in 1853 and ranked in the world top 25. Its
  programmable footprint is small, unmarketed and genuinely its own in two
  places — which is more than most of this cohort can say. The institution
  operates a public, unauthenticated JSON API over 7,417 spatial datasets in
  the Spatial Urban Data Observatory (GeoNode, on unimelb.edu.au), and it runs
  Minerva Access — a self-hosted DSpace 7.6 repository on its own ITS
  infrastructure — exposing both a HAL+JSON REST API and an OAI-PMH 2.0
  harvesting endpoint whose fourteen metadata formats include two the Library
  built itself (`umbl`, and a `trove` crosswalk for the National Library of
  Australia). It also operates its own Shibboleth SAML 2.0 identity provider,
  registered in the Australian Access Federation and reachable as public
  metadata. None of these is documented as a product: there is no developer
  portal, no OpenAPI, no changelog, no status page, no rate-limit signal and
  no support channel for any of them, and the University publishes no
  machine-readable contract for anything it runs. Everything else that looks
  like a University of Melbourne API is a tenancy — Melbourne Data on
  Figshare, the open spatial portal on Esri ArcGIS Hub, web SSO on Okta, the
  internal API programme on Boomi. Those relationships are recorded here with
  `x-operator: tenant` and no vendor contract is stored under this slug.
type: Index
