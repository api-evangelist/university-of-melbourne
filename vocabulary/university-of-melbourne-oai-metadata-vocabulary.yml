x-operator: institution
description: >-
  The metadata vocabulary Minerva Access will serve to a harvester. Fourteen
  formats, twelve of them standard DSpace crosswalks and TWO of them built by
  the University of Melbourne for its own purposes. The two local formats are
  the reason this artifact exists: they are evidence that the institution does
  engineering on this surface rather than merely hosting a package, which is
  precisely the distinction the university pipeline is built to draw.
institution_specific:
  - prefix: umbl
    namespace: 'http://www.dspace.org/xmlns/dspace/umbl'
    schema: 'http://www.openarchives.org/OAI/2.0/'
    reading: >-
      "umbl" = University of Melbourne Library. A local crosswalk in the
      DSpace namespace that does not ship with stock DSpace 7.6.
  - prefix: trove
    namespace: 'http://trove.nla.gov.au/oai/uom'
    schema: 'http://www.openarchives.org/OAI/2.0/'
    reading: >-
      A crosswalk written for harvesting into Trove, the National Library of
      Australia's aggregated discovery service. The namespace carries a `uom`
      path segment, i.e. it is Melbourne's own slot in the national harvest.
      This is a real, if small, piece of national-infrastructure integration.
